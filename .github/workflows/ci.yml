name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: pnpm --config.minimum-release-age=0 --recursive run typecheck
      - run: pnpm --config.minimum-release-age=0 --recursive run test
      - run: pnpm --config.minimum-release-age=0 --recursive run build
